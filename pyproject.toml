[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpmap"
version = "1.0.0"
description = "Static attack surface analyzer for AI agents, MCP servers, and LLM tool definitions."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bogdan Ticu", email = "bogdanticuoffice@gmail.com" }]
keywords = [
    "mcp", "ai-security", "llm-security", "owasp", "mitre-atlas",
    "agent-security", "devsecops", "threat-modeling", "ai-agents",
    "model-context-protocol"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
mcpmap = "mcpmap.cli:app"

[project.urls]
Homepage = "https://github.com/bogdanticu88/mcpmap"
Repository = "https://github.com/bogdanticu88/mcpmap"
"Bug Tracker" = "https://github.com/bogdanticu88/mcpmap/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcpmap*"]

[tool.setuptools.package-data]
mcpmap = ["mcpmap_rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcpmap --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py39"
